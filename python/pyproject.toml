[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "aruco-nano"
version = "0.1.0"
description = "Python wrapper for ArUco Nano, a header-only ArUco marker detector"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "ColDSnit" }]
dependencies = ["numpy"]

[project.optional-dependencies]
draw = ["opencv-python>=4.9"]

[project.urls]
Homepage = "https://github.com/ColDSnit/aruco_nano"
Upstream = "https://github.com/rmsalinas/aruco_nano"

[tool.scikit-build]
cmake.build-type = "Release"
# The official OpenCV 4.11.0 Windows prebuilt is vc16 (MSVC 2019). Force the
# matching generator so OpenCVConfig.cmake resolves the vc16 runtime; the
# newest MSVC (VS 18) maps to a runtime the prebuilt does not ship.
cmake.args = ["-G", "Visual Studio 16 2019"]
wheel.packages = ["aruco_nano"]
# Keep the sdist clean: exclude build artifacts and the stale extension/DLL
# that would otherwise be swept in from the working tree.
sdist.exclude = ["build", "*.egg-info", "*.pyd", "*.dll", "*.pdb"]
